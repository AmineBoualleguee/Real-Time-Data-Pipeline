apiVersion: 1

groups:
  - orgId: 1
    name: pipeline-alerts
    folder: Pipeline Alerts
    interval: 1m
    rules:
      - uid: api-down
        title: API is down
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: up{job="api"}
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Prometheus has not been able to scrape the FastAPI /metrics endpoint for 2+ minutes.

      - uid: no-new-events
        title: No events ingested in the last 5 minutes
        condition: C
        data:
          - refId: A
            datasourceUid: postgres-analytics
            relativeTimeRange:
              from: 600
              to: 0
            model:
              format: table
              rawSql: >-
                SELECT count(*)::float AS event_count
                FROM analytics.events
                WHERE event_time >= now() - interval '5 minutes'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: No rows have landed in analytics.events in 5+ minutes - check producer, Kafka, and the Spark streaming job.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check producer/app api/app spark/app

  test-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r producer/requirements-dev.txt
      - run: pytest producer/tests -v

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r api/requirements-dev.txt
      - run: pytest api/tests -v

  test-spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r spark/requirements-dev.txt
      - run: pytest spark/tests -v

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  e2e-test:
    runs-on: ubuntu-latest
    needs: [lint, test-producer, test-api, test-spark, compose-validate]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start the core pipeline
        run: docker compose up -d --build postgres kafka producer spark api
      - name: Wait for the API and Spark to be producing fresh data
        run: |
          for i in $(seq 1 90); do
            body=$(curl -sf -H "X-API-Key: local-dev-key-change-me" \
              "http://localhost:8000/events/recent?limit=1" || true)
            if echo "$body" | grep -q '"count":1'; then
              echo "Pipeline is producing data."
              break
            fi
            echo "Waiting for pipeline... ($i/90)"
            sleep 10
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r tests/integration/requirements.txt
      - run: pytest tests/integration -v
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
